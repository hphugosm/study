<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Studilo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Studilo — tvůj kalendář, studijní materiály a procvičování na jednom místě.">
  <title>Studilo — Studuj v klidu.</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
  <script>
    try {
      const p = JSON.parse(localStorage.getItem('study:preferences:v1') || '{}');
      const t = ['light','dark','paper'].includes(p?.theme) ? p.theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.accent = ['sage','blue','plum','amber'].includes(p?.accent) ? p.accent : 'sage';
      document.documentElement.dataset.largeText = String(p?.largerText === true);
      document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
    } catch {}
  </script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./themes.css">
  <link rel="stylesheet" href="./settings.css">
  <link rel="stylesheet" href="./modules/math-worksheets/vendor/katex/katex.min.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Přejít na obsah</a>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-block"><a class="wordmark" href="#/" aria-label="Studilo — Kalendář">Studi<span>lo</span></a><span id="page-context" class="header-context">Kalendář</span></div>
      <div class="history-controls" role="group" aria-label="Přecházení mezi stránkami">
        <button id="page-back" class="history-button" type="button" aria-label="Zpět" disabled><span data-icon="left"></span></button>
        <button id="page-forward" class="history-button" type="button" aria-label="Vpřed" disabled><span data-icon="right"></span></button>
      </div>
      <nav class="main-nav" aria-label="Hlavní navigace">
        <a href="#/" data-nav="calendar"><span data-icon="calendar"></span>Kalendář</a>
        <a href="#/subjects" data-nav="subjects"><span data-icon="grid"></span>Předměty</a>
        <a href="#/practice" data-nav="practice"><span data-icon="layers"></span>Procvičování</a>
      </nav>
      <div class="header-note"><span class="status-dot"></span>Prostor pro soustředění</div>
    </div>
  </header>
  <div id="app-update-status" class="app-update-status" role="status" aria-live="polite" hidden></div>
  <main id="main" tabindex="-1"></main>
  <footer class="site-footer"><a href="#/" class="footer-brand">Studilo</a><span>Malé kroky. Velké pokroky.</span><a class="settings-link" href="./modules/moodle-sync/index.html">Novinky ze školy</a><a class="settings-link" href="#/settings"><span data-icon="settings"></span>Nastavení</a><span>Materiály, výpisky a úkoly na jednom místě.</span></footer>
