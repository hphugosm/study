name: Verify live Studilo

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Browser checks to run
        type: choice
        default: full
        options:
          - full
          - pixels
          - notes
          - assignments

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Test studilo.xyz in Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STUDY_TEST_URL: https://studilo.xyz/
      CI: 'true'
    steps:
      - name: Check out tests
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build release snapshots for update lifecycle tests
        run: npm run build

      - name: Install browser engines and system dependencies
        run: npx --no-install playwright install --with-deps chromium webkit

      - name: Run complete live browser suite
        if: inputs.suite != 'pixels' && inputs.suite != 'notes' && inputs.suite != 'assignments'
        run: npm run test:e2e

      - name: Run focused live pixel checks
        if: inputs.suite == 'pixels'
        run: npx --no-install playwright test tests/pixels.spec.mjs --project=desktop --project=mobile --project=pixels-safari

      - name: Run focused live notes checks
        if: inputs.suite == 'notes'
        run: npx --no-install playwright test tests/notes.spec.mjs --project=desktop --project=mobile --project=notes-safari

      - name: Run focused live assignment checks
        if: inputs.suite == 'assignments'
        run: npx --no-install playwright test tests/assignments.spec.mjs --project=desktop --project=mobile --project=assignments-safari

      - name: Upload browser reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
